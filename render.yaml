services:
  - type: web
    name: trading-time-api
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: PAY_TO
        value: "0x98aD309E7Ea4CeeC93cE61E7d89cF697c2f4fD10"
      - key: X402_NETWORK
        value: mainnet
      - key: CDP_API_KEY_ID
        fromService:
          type: web
          name: market-hours-api
          envVarKey: CDP_API_KEY_ID
      - key: CDP_API_KEY_SECRET
        fromService:
          type: web
          name: market-hours-api
          envVarKey: CDP_API_KEY_SECRET
